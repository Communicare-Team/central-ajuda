name: Publicar Central de Ajuda

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-central-ajuda
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar o site
        run: |
          pip install -r requirements.txt
          python build.py
          echo "$GITHUB_SHA $(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/versao.txt

      - name: Publicar no Cloudflare Pages (projeto central-ajuda)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=central-ajuda --branch=main --commit-dirty=true
